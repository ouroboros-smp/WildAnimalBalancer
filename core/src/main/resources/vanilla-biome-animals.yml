# Snapshot of vanilla Minecraft (Java 1.21.x) passive land animal spawns per
# overworld biome, compiled from minecraft.wiki mob Spawning sections and
# cross-checked against biome pages. Bundled in the jar; not user-editable.
#
# Used when vanilla-biome-defaults is true in config.yml: the configured
# animals list is narrowed to the intersection with the biome's list here, so
# spawns stay biome-appropriate. It only ever filters; species not in the
# admin's animals list are never spawned. Biomes missing from this file
# (custom or datapack biomes) are not filtered. To override a biome, use
# biome-animals in config.yml, which takes precedence over this data.
#
# Java-edition lists only. Notable Java-vs-Bedrock differences applied here:
# llamas do not spawn in plain savanna or windswept_savanna on Java, ocelots
# spawn only in jungle, parrots only in jungle and bamboo_jungle, polar bears
# only in snowy_plains and ice_spikes (land biomes). Wolf entries include the
# 1.20.5+ variant ranges. If a future MC version changes spawn lists, update
# this file.

