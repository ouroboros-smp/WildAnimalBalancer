name: Release

# Push a tag like v2.0.1 to build and publish a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            paper/build/libs/WildAnimalBalancer-paper-2.0.1.jar
            fabric/build/libs/WildAnimalBalancer-fabric-2.0.1.jar
            fabric-hud/build/libs/WildAnimalBalancer-fabric-hud-2.0.1.jar
      - name: Publish Paper to Modrinth
        if: vars.MODRINTH_PROJECT_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: paper/build/libs/WildAnimalBalancer-paper-2.0.1.jar
          modrinth-name: WildAnimalBalancer ${{ github.ref_name }} (Paper/Folia)
          modrinth-version: ${{ github.ref_name }}-paper
          version-type: release
          environment: server
          loaders: |
            paper
            folia
            purpur
          game-versions: |
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.11
      - name: Publish Fabric server mod
        if: vars.MODRINTH_PROJECT_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/WildAnimalBalancer-fabric-2.0.1.jar
          name: WildAnimalBalancer ${{ github.ref_name }} (Fabric)
          version: ${{ github.ref_name }}-fabric
          version-type: release
          loaders: fabric
          game-versions: '26.2'
          environment: client? | server
          dependencies: 'fabric-api(required){modrinth:P7dR8mSH}'
