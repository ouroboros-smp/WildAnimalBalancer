# WildAnimalBalancer config for Fabric.
# Edit anything here and run /wildlife reload to apply it without restarting.

# How often (in seconds) each player's surroundings are checked and topped up.
cycle-seconds: 30

# Blocks around a player to census wild animals and to spawn within.
scan-radius: 96

# Wild animals wanted in an area with a single player.
base-target: 8

# Extra wanted per additional player sharing that area.
per-additional-player: 4

# Hard ceiling per area no matter how many players are present.
max-target: 40

# Most animals spawned per area per cycle. Keeps top-ups gradual instead of bursty.
max-per-cycle: 6

# Consecutive cycles an area must stay short before any top-up happens.
deficit-cycles: 3

# Most animals spawned per approximately 128-block area per hour.
cell-hourly-budget: 30

# Spawned animals are flagged to persist when players leave.
persistent-spawns: true

# Never spawn closer than this many blocks to the player.
min-spawn-distance: 24

# Location attempts per animal before giving up on finding a spot.
spawn-tries: 20

# Minimum sky light at the spawn block.
min-sky-light: 7

# Canonical entity ids the balancer may spawn. Legacy names such as COW are
# accepted and normalized to minecraft:cow automatically.
animals:
  - minecraft:cow
  - minecraft:pig
  - minecraft:sheep
  - minecraft:chicken

# Narrow the configured list per biome using the bundled vanilla snapshot.
# This is a filter only and never introduces species not listed above.
vanilla-biome-defaults: true

# Optional per-biome overrides. Keys are biome key paths, for example
# snowy_plains. An empty list disables the biome.
# biome-animals:
#   snowy_plains:
#     - minecraft:sheep
biome-animals: {}

# Dimensions where the balancer runs. Empty means every dimension. Fabric uses
# dimension ids here, not Paper world folder names.
# enabled-worlds:
#   - minecraft:overworld
enabled-worlds: []

# Log one console line per successful top-up.
log-spawns: false

# Append top-ups as JSON lines to
# config/wildanimalbalancer/spawn-log.jsonl on a dedicated IO thread.
spawn-log-file: false

# Log a one-line summary every N cycles. Zero disables the summary.
status-log-cycles: 0

# Built-in Prometheus endpoint serving GET /metrics. Keep it private.
metrics:
  enabled: false
  bind: 127.0.0.1
  port: 9940
