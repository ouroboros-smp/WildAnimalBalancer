name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-smoke:
    name: Boot smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [paper, folia]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build plugin jar
        run: ./gradlew :paper:jar --no-daemon
      - name: Download ${{ matrix.platform }} server (1.21.11)
        run: |
          set -euo pipefail
          MCV=1.21.11
          PROJECT="${{ matrix.platform }}"
          # The legacy api.papermc.io/v2 endpoint was retired (410); fill.papermc.io/v3 replaces it.
          UA="WildAnimalBalancer-CI (github.com/ouroboros-smp/WildAnimalBalancer)"
          BUILDS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -A "$UA" "https://fill.papermc.io/v3/projects/$PROJECT/versions/$MCV/builds")
          URL=$(jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' <<< "$BUILDS")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -A "$UA" -o server.jar "$URL"
          echo "$PROJECT $MCV -> $URL"
      - name: Prepare server
        run: |
          set -eu
          echo "eula=true" > eula.txt
          mkdir -p plugins
          cp paper/build/libs/WildAnimalBalancer-paper-2.0.1.jar plugins/
      - name: Boot server, then stop
        run: |
          set -u
          java -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            grep -q "Done (" server.log && break
            kill -0 "$PID" 2>/dev/null || { echo "Server exited early"; break; }
            sleep 1
          done
          sleep 5
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "===== server.log (tail) ====="
          tail -n 80 server.log
      - name: Assert plugin enabled with no errors
        run: |
          set -e
          grep -q "WildAnimalBalancer running." server.log || { echo "::error::Plugin did not enable on ${{ matrix.platform }}"; exit 1; }
          if grep -nE "Error occurred while enabling WildAnimalBalancer|accessing entity state off owning region|Could not load 'plugins" server.log; then
            echo "::error::Plugin error detected on ${{ matrix.platform }}"; exit 1
          fi
          echo "OK: enabled cleanly on ${{ matrix.platform }}"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.platform }}
          path: server.log
          if-no-files-found: warn

  e2e:
    name: E2E spawn check (folia)
    runs-on: ubuntu-latest
    # The released Mineflayer package pins protocol deps that cap at 1.21.4, so the E2E
    # server runs there. The plugin's behaviour is identical across 1.21.x, and the real
    # 1.21.11 runtime (the version we play on) is covered by the boot-smoke jobs above.
    env:
      MCV: '1.21.4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build plugin jar
        run: ./gradlew :paper:jar --no-daemon
      - name: Download Folia (${{ env.MCV }})
        run: |
          set -euo pipefail
          PROJECT=folia
          # The legacy api.papermc.io/v2 endpoint was retired (410); fill.papermc.io/v3 replaces it.
          UA="WildAnimalBalancer-CI (github.com/ouroboros-smp/WildAnimalBalancer)"
          BUILDS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -A "$UA" "https://fill.papermc.io/v3/projects/$PROJECT/versions/$MCV/builds")
          URL=$(jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)' <<< "$BUILDS")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -A "$UA" -o server.jar "$URL"
          echo "$PROJECT $MCV -> $URL"
      - name: Configure server
        run: |
          set -eu
          echo "eula=true" > eula.txt
          cp .github/e2e/server.properties server.properties
          mkdir -p plugins/WildAnimalBalancer
          cp paper/build/libs/WildAnimalBalancer-paper-2.0.1.jar plugins/
          cp .github/e2e/config.yml plugins/WildAnimalBalancer/config.yml
      - name: Boot Folia
        run: |
          set -u
          java -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 180); do
            grep -q "Done (" server.log && break
            kill -0 "$(cat server.pid)" 2>/dev/null || { echo "Server exited early"; tail -n 60 server.log; exit 1; }
            sleep 1
          done
          grep -q "WildAnimalBalancer running." server.log || { echo "Plugin did not enable"; tail -n 60 server.log; exit 1; }
          echo "Server is up and plugin enabled"
      - name: Run Mineflayer bot
        working-directory: .github/e2e
        env:
          MC_VERSION: ${{ env.MCV }}
        run: |
          npm install --no-audit --no-fund
          node bot.js
      - name: Stop server and show log
        if: always()
        run: |
          if [[ -f server.pid ]]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          sleep 3
          echo "===== server.log (tail) ====="
          if [[ -f server.log ]]; then tail -n 120 server.log; fi
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-folia-e2e
          path: server.log
          if-no-files-found: warn

  fabric-smoke:
    name: Fabric 26.2 boot and metrics smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Fabric server mod
        run: ./gradlew :fabric:build --no-daemon
      - name: Prepare Fabric server
        run: |
          set -euo pipefail
          curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/26.2/0.19.3/1.1.1/server/jar"
          echo "eula=true" > eula.txt
          mkdir -p mods config/wildanimalbalancer
          cp fabric/build/libs/WildAnimalBalancer-fabric-2.0.1.jar mods/
          curl -fsSL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.154.2+26.2/fabric-api-0.154.2+26.2.jar"
          cp fabric/src/main/resources/config.yml config/wildanimalbalancer/config.yml
          sed -i '0,/enabled: false/s//enabled: true/' config/wildanimalbalancer/config.yml
      - name: Boot Fabric
        run: |
          set -u
          java -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 180); do
            grep -q "Done (" server.log && break
            kill -0 "$(cat server.pid)" 2>/dev/null || { echo "Server exited early"; tail -n 100 server.log; exit 1; }
            sleep 1
          done
          grep -q "Done (" server.log || { echo "Fabric server timed out"; tail -n 100 server.log; exit 1; }
          grep -q "WildAnimalBalancer running." server.log || { echo "Mod did not initialize"; tail -n 100 server.log; exit 1; }
      - name: Assert Prometheus endpoint
        run: |
          set -euo pipefail
          curl -fsSL http://127.0.0.1:9940/metrics -o metrics.txt
          for series in \
            wildlife_census_total \
            wildlife_deficit_cycles_total \
            wildlife_topup_blocked_total \
            wildlife_spawn_groups_total \
            wildlife_spawned_animals_total \
            wildlife_spawned_species_total \
            wildlife_spawned_world_total \
            wildlife_cells_active \
            wildlife_cells_on_deficit_streak \
            wildlife_cells_budget_spent; do
            grep -q "$series" metrics.txt || { echo "Missing metric: $series"; exit 1; }
          done
          grep -q 'wildlife_census_total{result="skipped_region_boundary"} 0' metrics.txt
      - name: Stop server and show log
        if: always()
        run: |
          if [[ -f server.pid ]]; then
            kill "$(cat server.pid)" 2>/dev/null || true
            wait "$(cat server.pid)" 2>/dev/null || true
          fi
          echo "===== server.log (tail) ====="
          if [[ -f server.log ]]; then tail -n 120 server.log; fi
          if grep -nE "Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server" server.log; then
            echo "::error::Fabric mod error detected"; exit 1
          fi
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-fabric
          path: server.log
          if-no-files-found: warn
